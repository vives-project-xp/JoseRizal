name: Verify static site

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: joserizalapp
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: joserizalapp/.node-version
          cache: npm
          cache-dependency-path: joserizalapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate content and build site
        run: npm run check
